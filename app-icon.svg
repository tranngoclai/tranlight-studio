<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1537"/>
      <stop offset="1" stop-color="#0b0a18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc861" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffc861" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe3a1" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff7a59" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="440" cy="512" r="380" fill="url(#glow)"/>
  <!-- light beam fanning out from the play mark -->
  <path d="M560 512 L1024 300 L1024 724 Z" fill="url(#beam)" opacity="0.55"/>
  <!-- rounded play triangle -->
  <path d="M330 300 Q330 250 374 274 L640 470 Q690 512 640 554 L374 750 Q330 774 330 724 Z" fill="url(#play)"/>
</svg>
